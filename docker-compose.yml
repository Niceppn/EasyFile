version: '3.8'

services:
  qubezip:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qubezip-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - CONTACT_ADMIN_EMAIL=${CONTACT_ADMIN_EMAIL:-pphutana01@gmail.com}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-qubezip2026}
    volumes:
      - qubezip-data:/app/.data

volumes:
  qubezip-data:
    driver: local
